name: Deploy KYB Form to GitHub Pages

on:
  push:
    branches: [main, feature-new-kyb-form, feature-kyb-form-v2]
    paths:
      - 'kyb-form/**'
      - '.github/workflows/deploy-kyb-form.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: kyb-form/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: kyb-form

      - name: Build
        run: npm run build
        working-directory: kyb-form
        env:
          VITE_INCODE_API_URL: ${{ secrets.VITE_INCODE_API_URL }}
          VITE_INCODE_API_KEY: ${{ secrets.VITE_INCODE_API_KEY }}
          VITE_INCODE_CONFIGURATION_ID: ${{ secrets.VITE_INCODE_CONFIGURATION_ID }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: kyb-form/dist
