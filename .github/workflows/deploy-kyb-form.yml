name: Deploy KYB Form to GitHub Pages

on:
  push:
    branches: [main, feature-new-kyb-form]
    paths:
      - 'kyb-form/**'
      - '.github/workflows/deploy-kyb-form.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: kyb-form/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: kyb-form

      - name: Build
        run: npm run build
        working-directory: kyb-form
        env:
          VITE_INCODE_API_URL: ${{ secrets.VITE_INCODE_API_URL }}
          VITE_INCODE_API_KEY: ${{ secrets.VITE_INCODE_API_KEY }}
          VITE_INCODE_CONFIGURATION_ID: ${{ secrets.VITE_INCODE_CONFIGURATION_ID }}

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: kyb-form/dist

      - uses: actions/deploy-pages@v4
        id: deployment
